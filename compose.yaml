name: resilienceplane
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: resilienceplane
      POSTGRES_USER: resilienceplane
      POSTGRES_PASSWORD: ${RP_DATABASE_PASSWORD:?Run scripts/init-local.sh}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilienceplane -d resilienceplane"]
      interval: 3s
      timeout: 2s
      retries: 20
    mem_limit: 512m
    cpus: 1
    security_opt: ["no-new-privileges:true"]
  api:
    build: .
    image: resilienceplane:local
    environment:
      DATABASE_URL: postgres://resilienceplane:${RP_DATABASE_PASSWORD:?Run scripts/init-local.sh}@postgres:5432/resilienceplane?sslmode=disable
      RP_LISTEN: 0.0.0.0:8080
      RP_OPERATOR_TOKEN: ${RP_OPERATOR_TOKEN:?Run scripts/init-local.sh}
      RP_VIEWER_TOKEN: ${RP_VIEWER_TOKEN:?Run scripts/init-local.sh}
      RP_KUBERNETES: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [metrics]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
    ports:
      - "127.0.0.1:9390:9090"
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
      - prometheus-data:/prometheus
    depends_on: [api]
    mem_limit: 384m
    cpus: 0.5
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  grafana:
    image: grafana/grafana:13.3.0
    profiles: [metrics]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${RP_GRAFANA_PASSWORD:?Run scripts/init-local.sh to generate the Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    mem_limit: 384m
    cpus: 0.5
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
volumes:
  pgdata:
  prometheus-data:
  grafana-data:
