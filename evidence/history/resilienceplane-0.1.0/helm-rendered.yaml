  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Source: resilienceplane/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilienceplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resilienceplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resilienceplane
    spec:
      serviceAccountName: resilienceplane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: "resilienceplane:local"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: resilienceplane-runtime
          env:
            - name: RP_LISTEN
              value: 0.0.0.0:8080
            - name: RP_KUBERNETES
              value: "true"
            - name: RP_NAMESPACE
              value: "rp-demo"
            - name: RP_CLUSTER_ID
              value: "local"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
