# Source: resilienceplane/crds/reliabilitytargets.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: reliabilitytargets.reliability.resilienceplane.io
spec:
  group: reliability.resilienceplane.io
  scope: Namespaced
  names:
    plural: reliabilitytargets
    singular: reliabilitytarget
    kind: ReliabilityTarget
    shortNames: [rtarget]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [deployment, container, healthyImage]
              properties:
                deployment:
                  type: string
                  minLength: 1
                  maxLength: 253
                container:
                  type: string
                  minLength: 1
                  maxLength: 63
                healthyImage:
                  type: string
                  pattern: '^\S+@sha256:[a-f0-9]{64}$'

