apiVersion: v1
kind: ServiceAccount
metadata:
  name: resilienceplane-controller
  namespace: rp-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resilienceplane-controller
  namespace: rp-demo
rules:
  - apiGroups: [reliability.resilienceplane.io]
    resources: [reliabilitytargets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resilienceplane-controller
  namespace: rp-demo
subjects:
  - kind: ServiceAccount
    name: resilienceplane-controller
    namespace: rp-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resilienceplane-controller
