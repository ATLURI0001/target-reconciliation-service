apiVersion: v1
kind: ServiceAccount
metadata:
  name: target-reconciliation-service-controller
  namespace: trs-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: target-reconciliation-service-controller
  namespace: trs-demo
rules:
  - apiGroups: [reliability.trs.io]
    resources: [reliabilitytargets]
    verbs: [get, list, watch]
  - apiGroups: [reliability.trs.io]
    resources: [reliabilitytargets/status]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: target-reconciliation-service-controller
  namespace: trs-demo
subjects:
  - kind: ServiceAccount
    name: target-reconciliation-service-controller
    namespace: trs-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: target-reconciliation-service-controller
