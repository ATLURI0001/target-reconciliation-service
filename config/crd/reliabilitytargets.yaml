apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: reliabilitytargets.reliability.trs.io
spec:
  group: reliability.trs.io
  scope: Namespaced
  names:
    plural: reliabilitytargets
    singular: reliabilitytarget
    kind: ReliabilityTarget
    shortNames: [rtarget]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: ObservedGeneration
          type: integer
          jsonPath: .status.observedGeneration
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [deployment, container, healthyImage]
              properties:
                deployment:
                  type: string
                  minLength: 1
                  maxLength: 253
                container:
                  type: string
                  minLength: 1
                  maxLength: 63
                healthyImage:
                  type: string
                  pattern: '^\S+@sha256:[a-f0-9]{64}$'

            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, observedGeneration, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
                lastObservation:
                  type: object
                  properties:
                    deploymentUID: {type: string}
                    generation: {type: integer, format: int64}
                    observedGeneration: {type: integer, format: int64}
                    desired: {type: integer, format: int64}
                    replicas: {type: integer, format: int64}
                    available: {type: integer, format: int64}
                    updated: {type: integer, format: int64}
                    image: {type: string}
