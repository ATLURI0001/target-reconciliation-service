image:
  repository: resilienceplane
  tag: local
  pullPolicy: IfNotPresent
# Name of a pre-created Secret with DATABASE_URL, RP_OPERATOR_TOKEN, RP_VIEWER_TOKEN.
existingSecret: resilienceplane-runtime
managedNamespace: rp-demo
clusterID: local
kubernetesEnabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
