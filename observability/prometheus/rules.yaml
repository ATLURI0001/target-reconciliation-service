groups:
  - name: resilienceplane-core
    rules:
      - alert: ResiliencePlaneAPIUnavailable
        expr: up{job="resilienceplane"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Control-plane metrics cannot be scraped
          description: Check API process and network before interpreting missing workload telemetry.
      - alert: ResiliencePlaneTelemetryStale
        expr: time() - resilienceplane_cluster_last_seen_seconds > 30
        for: 20s
        labels:
          severity: warning
        annotations:
          summary: Cluster telemetry is stale under the default 30-second freshness policy
          description: This is an observation gap, not evidence that the cluster or workload is unavailable. Update this alert if policy freshness changes.
      - alert: ResiliencePlaneDeploymentUnavailable
        expr: resilienceplane_deployment_available_replicas < resilienceplane_deployment_desired_replicas
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Observed Deployment availability is below desired replicas
          description: Verify telemetry freshness, generation, and rollout state before approving recovery.
      - record: resilienceplane:http_failure_ratio5m
        expr: rate(resilienceplane_http_failures_total[5m]) / clamp_min(rate(resilienceplane_http_requests_total[5m]), 0.000001)
