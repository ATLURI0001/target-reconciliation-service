global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules.yaml
scrape_configs:
  - job_name: target-reconciliation-service
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: [api:8080]
        labels:
          profile: local
